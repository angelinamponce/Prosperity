# Render Blueprint for Sprout's API (the Gemini-backed chat; Claude also supported). The website itself stays on GitHub Pages.
# Setup steps: DEPLOY.md.
services:
  - type: web
    name: prosperity-sprout-api
    runtime: node
    # Free sleeps after 15 idle minutes and takes about a minute to wake; the chat handles that.
    # Change to 0.5c-512mb (Starter) to keep it awake.
    plan: free
    region: oregon
    branch: main
    rootDir: my-app
    # Only the server's own dependencies (the Gemini and Anthropic SDKs); the React app isn't built here.
    buildCommand: npm ci --prefix server --no-audit --no-fund
    startCommand: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON server/index.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # Redeploy only when code the server runs changes (paths are from the repo root).
    # Keep in sync with the imports in server/chat.mjs and src/sprout/tools.js.
    buildFilter:
      paths:
        - my-app/server/**
        - my-app/src/sprout/tools.js
        - my-app/src/dashboard/finance.js
        - my-app/src/dashboard/summaries.js
        - my-app/src/design/format.js
    envVars:
      # gemini (Google AI free tier) or anthropic. Switching to anthropic also needs ANTHROPIC_API_KEY (and optionally
      # SPROUT_MODEL) added in the dashboard.
      - key: SPROUT_LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # secret: you paste it in the Render dashboard
      # Free-tier models tried in order (ai.google.dev/gemini-api/docs/pricing): when one is overloaded (503) or out of
      # quota (429) the next answers. Flash-Lite first: it has the higher free limits. On the free tier Google may use prompts to improve its products.
      - key: SPROUT_GEMINI_MODELS
        value: gemini-3.5-flash-lite,gemini-3.8-flash
      - key: SPROUT_EFFORT
        value: low
      - key: SPROUT_ALLOWED_ORIGINS
        value: https://angelinamponce.github.io
      # Render's proxy sits in front, so rate limits read the visitor's IP from its headers.
      - key: SPROUT_TRUST_PROXY
        value: "1"
      # Global safety net per UTC day; when either is used up the chat switches to preview replies until midnight UTC.
      # Preview replies also when every Gemini model is out of free-tier quota (429), until the first one frees up.
      - key: SPROUT_DAILY_MESSAGE_CAP
        value: "300"
      - key: SPROUT_DAILY_TOKEN_CAP
        value: "1500000"
      # Production: localhost origins and chat requests without an Origin header are refused.
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
